name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and check
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure Android signing secrets before building a public APK.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/forge-release.p12"
      - name: Build standalone signed APK
        working-directory: android
        env:
          FORGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FORGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FORGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export FORGE_KEYSTORE_PATH="$RUNNER_TEMP/forge-release.p12"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/G-Code-Forge.apk
          cd artifacts
          sha256sum G-Code-Forge.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: G-Code-Forge-Android
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/forge-release.p12"
